<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RescueX Control Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header id="hd">
 <div><h1>RescueX Control Room</h1><div class="st" id="st">SAFE</div></div>
 <div class="meta"><span>Battery <b id="bat">92%</b></span><span>Link <b id="lnk">LoRa, strong</b></span><span>Depth <b id="dep">240 m</b></span><span>Mission <b id="tm">00:00</b></span></div>
</header>

<div class="grid">
 <section class="card">
  <h2>Mine map, level 2</h2>
  <svg viewBox="0 0 600 340" role="img" aria-label="Mine map with workers, rover and gas zones">
   <rect width="600" height="340" rx="8" fill="var(--rock)"/>
   <g stroke="var(--tunnel)" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 170 H560"/><path d="M180 170 V60 H320"/><path d="M400 170 V290 H540"/>
   </g>
   <circle id="heat" cx="300" cy="170" r="10" fill="var(--danger)" opacity="0"/>
   <g font-size="12" fill="var(--mute)"><text x="46" y="130">Zone A (entry)</text><text x="250" y="212">Zone B (face)</text><text x="410" y="322">Zone C</text><text x="186" y="44">Refuge chamber</text></g>
   <rect x="20" y="155" width="22" height="30" rx="4" fill="var(--accent)"/><text x="14" y="200" font-size="11" fill="var(--mute)">Base</text>
   <g id="workers"></g>
   <g id="rover"><rect x="-11" y="-8" width="22" height="16" rx="4" fill="var(--accent)"/><circle cx="-6" cy="9" r="3" fill="var(--ink)"/><circle cx="6" cy="9" r="3" fill="var(--ink)"/><text y="-13" text-anchor="middle" font-size="11" fill="var(--ink)">Rover</text></g>
  </svg>
  <div class="ctl">
   <button class="p" id="leak">Simulate gas leak</button>
   <button id="rst">Reset</button>
   <button id="rtb">Return to base</button>
  </div>
 </section>

 <section class="card">
  <h2>Gas and environment</h2>
  <div class="gases" id="gases"></div>
  <svg viewBox="0 0 300 70" style="margin-top:8px" aria-label="Methane trend"><rect width="300" height="70" rx="6" fill="var(--rock)"/><line id="wl" x1="0" x2="300" stroke="var(--warn)" stroke-dasharray="4"/><line id="dl" x1="0" x2="300" stroke="var(--danger)" stroke-dasharray="4"/><polyline id="tr" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
  <div style="color:var(--mute);font-size:12px">Methane trend, last 60 readings</div>
 </section>
</div>

<div class="grid">
 <section class="card">
  <h2>Workers</h2>
  <div class="tbl"><table><thead><tr><th>Worker</th><th>Zone</th><th>Last seen</th><th>Status</th></tr></thead><tbody id="wt"></tbody></table></div>
 </section>
 <section class="card">
  <h2>AI hazard analysis</h2>
  <div class="zones" id="zones"></div>
  <div class="ai" id="ai">All zones normal. Continue patrol.</div>
 </section>
</div>

<section class="card" style="margin-top:12px">
 <h2>Event log</h2>
 <ul id="log"></ul>
</section>
</div>

<script src="script.js"></script>
</body>
</html>
